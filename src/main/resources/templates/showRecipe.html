<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>レシピ詳細</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
	<link th:href="@{/css/showRecipe.css}" rel="stylesheet" type="text/css">
</head>

<body>
	<!-- navbar section -->
	<nav class="navbar navbar-expand-lg navbar-light bg-dark py-3 fixed-top">
		<div class="container">
			<a class="navbar-brand" th:href="@{/home}">
				<h2 class="text-white pt-1">Repibum</h2>
			</a>
			<div class="text-white">
				<h1 class="me-5">レシピ詳細</h1>
			</div>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
				aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNav">
				<ul class="navbar-nav ms-auto">
					<li class="nav-item"><a class="nav-link" th:href="@{/recipe/list}">れしぴ</a></li>
					<li class="nav-item"><a class="nav-link" th:href="@{/recipe/register}">とうろく</a></li>
					<li class="nav-item"><a class="nav-link" th:href="@{/logout}">ろぐあうと</a></li>
				</ul>
			</div>
		</div>
	</nav>
	<!-- navbar section -->

	<!-- recipe show section -->
	<div class="show-details container">
		<div class="sentence">
			<div class="image">
				<!-- 画像がある場合はその画像を表示、ない場合はデフォルト画像を表示 -->
				<img th:src="@{${recipe.images != null && recipe.images != '' ? '/uploads/' + recipe.images : '/images/no_image_square.jpg'}}"
					alt="Recipe Image">
			</div>
			<h3 class="pt-4 pb-2" th:text="${recipe.name}"></h3>
			<div class="sentence-in">
				<h6>材料・調味料・作り方</h6>
				<p th:text="${recipe.detail}" style="white-space: pre-wrap;"></p>
			</div>
			<h6 class="showurl">URL：</h6>
			<a th:if="${recipe.url}" th:href="${recipe.url}" th:text="${recipe.url}"></a>
			<p th:unless="${recipe.url}"></p><br>
			<!--戻る・編集・削除ボタン-->
			<div class="d-grid gap-2 d-md-flex justify-content-md-end mt-3 ">
				<a th:href="@{/recipe/list}" class="btn btn-outline-dark me-2" tabindex="-1" role="button"
					aria-disabled="true"
					style="--bs-btn-padding-y: .25rem; --bs-btn-padding-x: .5rem; --bs-btn-font-size: .75rem;">戻る</a>
				<a th:href="@{/recipe/update/{id}(id=${recipe.id})}" class="btn btn-primary me-2" tabindex="-1"
					role="button" aria-disabled="true"
					style="--bs-btn-padding-y: .25rem; --bs-btn-padding-x: .5rem; --bs-btn-font-size: .75rem;">編集</a>
				<a th:href="@{/recipe/delete/{id}(id=${recipe.id})}" class="btn btn-danger me-2" tabindex="-1"
					role="button" aria-disabled="true"
					style="--bs-btn-padding-y: .25rem; --bs-btn-padding-x: .5rem; --bs-btn-font-size: .75rem;"
					onclick="return confirm('本当に削除してよろしいですか？');">削除</a>
			</div>
		</div>
	</div>
	<!-- recipe show section -->

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
		crossorigin="anonymous"></script>
</body>

</html>
